[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-slackbot"
version = "0.2.0"
description = "Slack bot DM bridge for Herdr agents (Herdr app via herdr-core, or the Herdr CLI plugin)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "slack_bolt>=1.18",
    "slack_sdk>=3.26",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
herdr-slackbot = "herdr_slackbot.__main__:main"

[tool.setuptools.packages.find]
include = ["herdr_slackbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to the running Herdr server (opt-in via HERDR_LIVE_TESTS=1)",
]
